name: Lab 7 - Python Testing (Haya Karanouh)

on:
  push:
    branches: ["lab7-haya-karanouh-testing"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test Lab 7
        run: python -m pytest -v test_user_Haya_Karanouh.py
